<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Interaktif Adab Islam Kanak-Kanak</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
      --primary: #FF7B9C;
      --primary-hover: #FF537C;
      --secondary: #4ECDC4;
      --accent: #FFD166;
      --purple: #9B51E0;
      --text-dark: #2D3142;
      --text-muted: #6C757D;
      --card-bg: #FFFFFF;
      --correct: #2ECC71;
      --wrong: #FF5252;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #E0F7FA;
      background-image: radial-gradient(#B2EBF2 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* 9:16 Mobile Outer Frame Container */
    .phone-wrapper {
      width: 100%;
      max-width: 420px;
      height: 92vh;
      max-height: 860px;
      background: #2D3142;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 10px #FFFFFF inset;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Inner Screen Frame */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--bg-gradient);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Bar */
    .app-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    .app-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(255, 123, 156, 0.4);
    }

    .app-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #F0F4F8;
      color: var(--text-dark);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      width: 4%;
      transition: width 0.3s ease;
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }

    .content-area::-webkit-scrollbar {
      width: 4px;
    }
    .content-area::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.1);
      border-radius: 4px;
    }

    /* Chapter Card Header */
    .chapter-badge {
      display: inline-block;
      background: var(--accent);
      color: #855B00;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 8px;
      box-shadow: 0 2px 5px rgba(255, 209, 102, 0.4);
    }

    .chapter-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      color: var(--text-dark);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    /* Section Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tap-to-reveal Interactive Cards */
    .reveal-card {
      background: #FFF9E6;
      border: 2px dashed #FFE082;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .reveal-card.revealed {
      background: #FFFFFF;
      border-style: solid;
      border-color: var(--secondary);
      text-align: left;
    }

    .reveal-hint {
      color: #D97706;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .reveal-content {
      display: none;
    }

    .reveal-card.revealed .reveal-hint {
      display: none;
    }

    .reveal-card.revealed .reveal-content {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    /* Arabic Box */
    .arabic-box {
      background: #F0F9FF;
      border-right: 4px solid #0284C7;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      text-align: right;
    }

    .arabic-text {
      font-family: 'Amiri', serif;
      font-size: 22px;
      line-height: 1.8;
      color: #0369A1;
      direction: rtl;
      margin-bottom: 6px;
    }

    .translation-text {
      font-size: 13px;
      color: #475569;
      font-style: italic;
      text-align: left;
      line-height: 1.4;
    }

    /* List Items */
    .custom-list {
      list-style: none;
    }

    .custom-list li {
      position: relative;
      padding-left: 26px;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-dark);
    }

    .custom-list li::before {
      content: "\f00c";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 0;
      top: 2px;
      color: var(--secondary);
      font-size: 14px;
    }

    .bad-list li::before {
      content: "\f00d";
      color: var(--wrong);
    }

    .badge-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      margin: 2px 4px 2px 0;
      background: #E2E8F0;
      color: #475569;
    }

    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-red { background: #FEE2E2; color: #991B1B; }
    .badge-blue { background: #E0F2FE; color: #075985; }

    /* Footer Navigation */
    .app-footer {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .nav-btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn-prev {
      background: #F1F5F9;
      color: #475569;
    }

    .btn-next {
      background: var(--primary);
      color: white;
    }

    .btn-quiz {
      background: var(--accent);
      color: #78350F;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    /* Modal Component */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: white;
      width: 100%;
      height: 85%;
      margin-top: auto;
      border-top-left-radius: 30px;
      border-top-right-radius: 30px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #F1F5F9;
    }

    .modal-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      color: var(--text-dark);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .chapter-select-item {
      padding: 12px 14px;
      background: #F8FAFC;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      border: 1px solid #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .chapter-select-item.active {
      background: #EEF2FF;
      border-color: #6366F1;
      color: #4338CA;
    }

    /* Quiz Screen Components */
    .quiz-card {
      background: white;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .quiz-q-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .quiz-q-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      color: var(--text-dark);
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .quiz-option {
      width: 100%;
      padding: 12px 14px;
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      text-align: left;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-option:active {
      transform: scale(0.98);
    }

    .quiz-option.correct-opt {
      background: #DCFCE7;
      border-color: #22C55E;
      color: #15803D;
    }

    .quiz-option.wrong-opt {
      background: #FEE2E2;
      border-color: #EF4444;
      color: #B91C1C;
    }

    .explanation-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    .explanation-box.correct {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #166534;
    }

    .explanation-box.wrong {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
    }

    /* Quiz Result Screen */
    .result-box {
      text-align: center;
      padding: 24px 16px;
    }

    .result-stars {
      font-size: 36px;
      color: #F59E0B;
      margin-bottom: 12px;
    }

    .result-score {
      font-family: 'Fredoka', sans-serif;
      font-size: 42px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .result-percent {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 16px;
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  
/* ============================================================
   KANAK-KANAK UI REDESIGN v2
   Fokus: 9-12 tahun | ceria | mudah baca | mesra sentuhan
   ============================================================ */
:root{
  --bg-gradient:linear-gradient(145deg,#FFF8E7 0%,#E8F8FF 48%,#F3E8FF 100%);
  --primary:#6C63FF;
  --primary-hover:#554BE8;
  --secondary:#20C997;
  --accent:#FFD93D;
  --purple:#A855F7;
  --text-dark:#263238;
  --text-muted:#64748B;
  --card-bg:#FFFFFF;
  --correct:#22C55E;
  --wrong:#FF5C70;
  --shadow:0 8px 0 rgba(55,65,81,.08),0 14px 30px rgba(99,102,241,.10);
  --radius:24px;
}

body{
  font-family:'Nunito',sans-serif;
  background:#FFF7D6;
  background-image:
    radial-gradient(circle at 10% 15%,rgba(255,217,61,.35) 0 7px,transparent 8px),
    radial-gradient(circle at 88% 12%,rgba(108,99,255,.20) 0 6px,transparent 7px),
    radial-gradient(circle at 15% 88%,rgba(32,201,151,.20) 0 8px,transparent 9px),
    radial-gradient(circle at 90% 82%,rgba(255,92,112,.16) 0 7px,transparent 8px);
  background-size:120px 120px,160px 160px,190px 190px,150px 150px;
}

.phone-wrapper{
  max-width:430px;
  height:94vh;
  max-height:900px;
  background:linear-gradient(145deg,#4338CA,#7C3AED);
  border-radius:42px;
  padding:9px;
  box-shadow:0 24px 0 rgba(67,56,202,.16),0 30px 60px rgba(30,41,59,.25);
}

.phone-screen{
  background:var(--bg-gradient);
  border-radius:34px;
}

.app-header{
  background:rgba(255,255,255,.96);
  padding:11px 14px;
  border-bottom:3px solid rgba(108,99,255,.08);
}

.app-title-box{gap:9px}

.app-icon{
  width:42px;height:42px;
  border-radius:15px;
  background:linear-gradient(135deg,#6C63FF,#A855F7);
  box-shadow:0 5px 0 rgba(76,63,180,.18);
  font-size:19px;
}

.app-title{
  font-family:'Fredoka',sans-serif;
  font-size:18px;
  letter-spacing:.2px;
}

.app-title::after{
  content:' ✨';
  font-size:13px;
}

.icon-btn{
  width:40px;height:40px;
  border-radius:14px;
  background:#F1F5FF;
  color:#4F46E5;
  box-shadow:0 3px 0 rgba(79,70,229,.08);
}

.icon-btn:active{transform:translateY(2px) scale(.96)}

.progress-container{
  height:10px;
  background:#E9EAFB;
}

.progress-bar{
  background:linear-gradient(90deg,#20C997,#6C63FF,#A855F7);
  border-radius:0 10px 10px 0;
}

.content-area{
  padding:18px 15px 22px;
}

/* Chapter heading becomes a colourful "lesson card" */
.chapter-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#FFF0A8;
  color:#7C5B00;
  border:2px solid #FFE071;
  padding:7px 12px;
  border-radius:999px;
  font-size:11px;
  box-shadow:0 4px 0 rgba(234,179,8,.12);
}

.chapter-title{
  font-family:'Fredoka',sans-serif;
  font-size:26px;
  line-height:1.18;
  margin:10px 2px 18px;
  color:#312E81;
  letter-spacing:.1px;
}

/* Add a playful underline */
.chapter-title::after{
  content:'';
  display:block;
  width:62px;
  height:6px;
  margin-top:9px;
  border-radius:99px;
  background:linear-gradient(90deg,#FFD93D,#FF8FAB);
}

.card{
  border:2px solid rgba(255,255,255,.95);
  border-radius:22px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.card-title{
  font-family:'Fredoka',sans-serif;
  font-size:17px;
  color:#4F46E5;
  margin-bottom:12px;
}

.custom-list li{
  padding-left:30px;
  margin-bottom:10px;
  font-size:15px;
  line-height:1.52;
}

.custom-list li::before{
  content:"✓";
  font-family:'Nunito',sans-serif;
  font-size:12px;
  font-weight:900;
  color:#fff;
  background:#20C997;
  width:21px;height:21px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  top:1px;
}

.bad-list li::before{
  content:"!";
  background:#FF6B7A;
}

.badge-tag{
  padding:7px 10px;
  border-radius:12px;
  font-size:12px;
  margin:3px 5px 3px 0;
  border:1px solid rgba(99,102,241,.08);
}

/* Tap-to-reveal looks like a game card */
.reveal-card{
  background:linear-gradient(135deg,#FFFBEA,#FFF4C7);
  border:3px dashed #FFD43B;
  border-radius:22px;
  padding:17px;
  box-shadow:0 7px 0 rgba(234,179,8,.10);
}

.reveal-hint{
  color:#8A6200;
  font-size:14px;
  font-weight:800;
  min-height:30px;
}

.reveal-hint i{
  background:#FFD93D;
  color:#7C5B00;
  width:29px;height:29px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.reveal-card.revealed{
  border-style:solid;
  border-color:#20C997;
  background:#F2FFFB;
}

/* Arabic / doa card */
.arabic-box{
  background:linear-gradient(135deg,#EFF8FF,#F4F0FF);
  border-right:0;
  border-left:6px solid #6C63FF;
  border-radius:17px;
  padding:15px;
}

.arabic-text{
  font-size:25px;
  line-height:1.9;
  color:#3730A3;
}

.translation-text{
  font-size:13px;
  line-height:1.55;
}

/* Bottom navigation */
.app-footer{
  background:rgba(255,255,255,.97);
  padding:10px 12px 12px;
  gap:8px;
  border-top:2px solid rgba(108,99,255,.08);
}

.nav-btn{
  min-height:48px;
  height:48px;
  border-radius:16px;
  font-family:'Fredoka',sans-serif;
  font-size:13px;
  font-weight:700;
  box-shadow:0 5px 0 rgba(51,65,85,.10);
}

.btn-prev{background:#EEF2F7;color:#475569}
.btn-next{
  background:linear-gradient(135deg,#6C63FF,#8B5CF6);
  color:white;
}
.btn-quiz{
  background:linear-gradient(135deg,#FFD93D,#FFC83D);
  color:#6B4F00;
}

.nav-btn:active{
  transform:translateY(3px) scale(.98);
  box-shadow:0 2px 0 rgba(51,65,85,.08);
}

/* Menu */
.modal-overlay{
  background:rgba(30,41,59,.52);
}

.modal-content{
  height:88%;
  padding:18px 15px 14px;
  border-top-left-radius:32px;
  border-top-right-radius:32px;
  background:linear-gradient(180deg,#FFFDF8,#F4F7FF);
}

.modal-title{
  font-size:21px;
  color:#312E81;
}

.chapter-grid{gap:10px}

.chapter-select-item{
  min-height:58px;
  padding:11px 13px;
  border:2px solid #E8EAF7;
  border-radius:17px;
  background:#fff;
  font-size:14px;
  box-shadow:0 3px 0 rgba(51,65,85,.05);
}

.chapter-select-item::before{
  content:'📖';
  margin-right:9px;
  font-size:20px;
}

.chapter-select-item.active{
  background:#EEF2FF;
  border-color:#8B5CF6;
  color:#4338CA;
  box-shadow:0 4px 0 rgba(99,102,241,.12);
}

/* Quiz */
.quiz-card{
  border-radius:24px;
  padding:18px;
  box-shadow:var(--shadow);
  border:2px solid #fff;
}

.quiz-q-num{
  display:inline-block;
  background:#EDE9FE;
  color:#6D28D9;
  padding:6px 9px;
  border-radius:10px;
  font-size:11px;
}

.quiz-q-text{
  font-family:'Fredoka',sans-serif;
  font-size:20px;
  line-height:1.35;
  color:#312E81;
  margin:14px 0 17px;
}

.quiz-option{
  min-height:56px;
  padding:12px 13px;
  background:#F8FAFF;
  border:2px solid #E2E8F0;
  border-radius:17px;
  font-size:15px;
  line-height:1.35;
  margin-bottom:11px;
  box-shadow:0 3px 0 rgba(51,65,85,.05);
}

.quiz-option > span{
  flex:0 0 31px !important;
  width:31px !important;
  height:31px !important;
  background:#EDE9FE !important;

    /* ==========================================================================
       WEB AUDIO API SOUND SYNTHESIZER (NO EXTERNAL AUDIO FILES NEEDED)
       ========================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      playCorrect() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        // Arpeggio C5 -> E5 -> G5 -> C6
        osc1.frequency.setValueAtTime(523.25, now);
        osc1.frequency.setValueAtTime(659.25, now + 0.08);
        osc1.frequency.setValueAtTime(783.99, now + 0.16);
        osc1.frequency.setValueAtTime(1046.50, now + 0.24);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc1.stop(now + 0.5);
      }

      playWrong() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.3);
      }

      playVictory() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [440, 554.37, 659.25, 880]; // A Major Fanfare
        
        notes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0.15, now + (i * 0.12));
          gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.12) + 0.4);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          
          osc.start(now + (i * 0.12));
          osc.stop(now + (i * 0.12) + 0.4);
        });
      }
    }

      renderChapterMenu();

    // Render Chapter Notes Screen
    function loadChapter(index) {
      if (index < 0 || index >= notesData.length) return;
      currentChapterIdx = index;
      isQuizMode = false;

      const data = notesData[index];

      // Update progress bar
      const pct = ((index + 1) / notesData.length) * 100;
      progressBar.style.width = `${pct}%`;

      // Update Nav Buttons
      btnPrev.disabled = index === 0;
      btnPrev.style.opacity = index === 0 ? '0.5' : '1';
      btnNext.style.display = 'flex';
      btnStartQuiz.style.display = 'flex';

      let html = `
        <div style="animation: fadeIn 0.3s ease;">
          <span class="chapter-badge">BAB ${data.id} / ${notesData.length} • ${data.category}</span>
          <div class="lesson-kicker">🌟 JOM BELAJAR!</div>
          <h2 class="chapter-title">${data.title}</h2>
      `;

      // Pengertian / Definition
      if (data.pengertian) {
        html += `
          <div class="card">
            <div class="card-title"><i class="fa-solid fa-book-open"></i> Pengertian & Maksud</div>
            <ul class="custom-list">
              ${data.pengertian.map(p => `<li>${p}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Golongan / Kategori
      if (data.golongan || data.kategori || data.contoh) {
        const items = data.golongan || data.kategori || data.contoh;
        const title = data.golongan ? "Golongan Terlibat" : (data.kategori ? "Kategori OKU" : "Contoh Majlis / Senarai");

            <div style="display:flex; flex-wrap:wrap;">

            </div>
          </div>
        `;
      }

      // Interactive Tap-To-Reveal Card: Adab & Amalan
      if (data.adab) {
        html += `
          <div class="reveal-card" onclick="toggleReveal(this)">
            <div class="reveal-hint"><i class="fa-solid fa-hand-pointer"></i> Sentuh (Tap) Untuk Lihat Adab & Amalan</div>
            <div class="reveal-content">

              <ul class="custom-list">
                ${data.adab.map(a => `<li>${a}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }

      // Doa or Hadis Box
      if (data.doa || data.hadis || data.salam || data.niat) {
        const item = data.doa || data.hadis || data.salam || data.niat;
        html += `
          <div class="card" style="background: #FAF5FF; border-color: #E9D5FF;">
            <div class="card-title" style="color: var(--purple);"><i class="fa-solid fa-scroll"></i> ${item.title || 'Lafaz Doa / Hadis / Salam'}</div>
        `;
        
        if (item.arabic) {
          html += `
            <div class="arabic-box">
              <div class="arabic-text">${item.arabic}</div>
              <div class="translation-text">${item.translation}</div>
            </div>
          `;
        } else {
          // Sub-doa like in Hadis Kematian / Hospital / Doa Masjid
          for (let k in item) {
            if (typeof item[k] === 'object' && item[k].ar) {
              html += `
                <div class="arabic-box">
                  <div class="arabic-text">${item[k].ar}</div>
                  <div class="translation-text">${item[k].tr}</div>
                </div>
              `;
            }
          }
        }

        html += `</div>`;
      }

      // Larangan / Perkara Dihindari
      if (data.larangan || data.dihindari) {
        const badItems = data.larangan || data.dihindari;
        html += `
          <div class="card" style="border-left: 4px solid var(--wrong);">
            <div class="card-title" style="color: var(--wrong);"><i class="fa-solid fa-triangle-exclamation"></i> Larangan & Dihindari</div>
            <ul class="custom-list bad-list">
              ${badItems.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Faedah / Kelebihan / Kepentingan
      if (data.faedah || data.kelebihan || data.kepentinganKebersihan || data.kelebihanSukan) {
        const goodList = data.faedah || data.kelebihan || data.kepentinganKebersihan || data.kelebihanSukan;
        html += `
          <div class="card" style="border-left: 4px solid var(--secondary);">
            <div class="card-title" style="color: #0D9488;"><i class="fa-solid fa-star"></i> Faedah & Hikmah Beradab</div>
            <ul class="custom-list">
              ${goodList.map(g => `<li>${g}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Akibat Tidak Beradab
      if (data.akibat || data.akibatKotor || data.akibatLanggarPeraturan || data.akibatSukan) {
        const badConsequences = data.akibat || data.akibatKotor || data.akibatLanggarPeraturan || data.akibatSukan;
        html += `
          <div class="card" style="background: #FFF5F5;">
            <div class="card-title" style="color: #C53030;"><i class="fa-solid fa-circle-xmark"></i> Akibat Tidak Beradab</div>
            <ul class="custom-list bad-list">
              ${badConsequences.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Sub-sections like Hospital/Pencemaran/Mahram/Hak Jiran
      if (data.hak) {
        html += `
          <div class="card">
            <div class="card-title"><i class="fa-solid fa-shield-halved"></i> Hak Jiran Perlu Dipelihara</div>
            <ul class="custom-list">${data.hak.map(h => `<li>${h}</li>`).join('')}</ul>
          </div>
        `;
      }

      if (data.mahram) {
        html += `
          <div class="card">
            <div class="card-title"><i class="fa-solid fa-users-rays"></i> Senarai Mahram</div>
            <div style="display:flex; flex-wrap:wrap;">${data.mahram.map(m => `<span class="badge-tag badge-green">${m}</span>`).join('')}</div>
          </div>
        `;
      }

      if (data.buahTanganXsesuai) {
        html += `
          <div class="card">
            <div class="card-title" style="color:var(--wrong);"><i class="fa-solid fa-ban"></i> Buah Tangan Tidak Sesuai (Hospital)</div>
            <div style="display:flex; flex-wrap:wrap;">${data.buahTanganXsesuai.map(bt => `<span class="badge-tag badge-red">${bt}</span>`).join('')}</div>
          </div>
        `;
      }

      if (data.pencemaran) {
        html += `
          <div class="card">
            <div class="card-title"><i class="fa-solid fa-cloud-showers-heavy"></i> Kesan Pencemaran Alam</div>
            <ul class="custom-list">${data.pencemaran.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
        `;
      }

      if (data.persamaan) {
        html += `
          <div class="card">
            <div class="card-title"><i class="fa-solid fa-scale-balanced"></i> Persamaan Solat Jumaat & Hari Raya</div>
            <ul class="custom-list">${data.persamaan.map(ps => `<li>${ps}</li>`).join('')}</ul>
          </div>
        `;
      }

      html += `</div>`;
      mainContent.innerHTML = html;
      mainContent.scrollTop = 0;
      updateActiveMenuItem();
    }

    // Interactive Tap-to-Reveal
    window.toggleReveal = function(element) {
      element.classList.toggle('revealed');
    }

    /* ==========================================================================
       QUIZ ENGINE LOGIC
       ========================================================================== */
    function startQuizMode() {
      isQuizMode = true;
      currentQuizQIdx = 0;
      quizScore = 0;
      userAnswers = [];
      btnStartQuiz.style.display = 'none';
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const chapter = notesData[currentChapterIdx];
      const questions = chapter.quiz;

      if (currentQuizQIdx >= questions.length) {
        renderQuizResult();
        return;
      }

      const qData = questions[currentQuizQIdx];
      const qNum = currentQuizQIdx + 1;

      let html = `
        <div class="quiz-card" style="animation: fadeIn 0.3s ease;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span class="quiz-q-num">Soalan ${qNum} daripada ${questions.length}</span>
            <span class="badge-tag badge-blue">Bab ${chapter.id}</span>
          </div>
          <div class="quiz-q-text">${qData.q}</div>

          <div id="optionsContainer">
            ${qData.opts.map((opt, idx) => `
              <button class="quiz-option" onclick="selectAnswer(${idx})">
                <span style="width:24px; height:24px; border-radius:50%; background:#E2E8F0; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">${String.fromCharCode(65 + idx)}</span>
                ${opt}
              </button>
            `).join('')}
          </div>

          <div id="explanationBox" class="explanation-box"></div>
        </div>
      `;

      mainContent.innerHTML = html;
      btnNext.style.display = 'none'; // Controlled by answer tap
    }

    window.selectAnswer = function(optIdx) {
      const chapter = notesData[currentChapterIdx];
      const qData = chapter.quiz[currentQuizQIdx];
      const options = document.querySelectorAll('.quiz-option');
      const expBox = document.getElementById('explanationBox');

      // Disable option buttons
      options.forEach(btn => btn.style.pointerEvents = 'none');

      const isCorrect = (optIdx === qData.ans);

      if (isCorrect) {
        options[optIdx].classList.add('correct-opt');
        sound.playCorrect();
        quizScore++;
        expBox.className = 'explanation-box correct';
        expBox.innerHTML = `<strong><i class="fa-solid fa-circle-check"></i> SYABAS! JAWAPAN BETUL 🎉</strong><br>${qData.exp}`;
      } else {
        options[optIdx].classList.add('wrong-opt');
        options[qData.ans].classList.add('correct-opt');
        sound.playWrong();
        expBox.className = 'explanation-box wrong';
        expBox.innerHTML = `<strong><i class="fa-solid fa-circle-xmark"></i> HAMPIR BETUL! 🌱</strong><br>${qData.exp}`;
      }

      expBox.style.display = 'block';

      // Auto advance to next question after 2.2 seconds
      setTimeout(() => {
        currentQuizQIdx++;
        renderQuizQuestion();
      }, 2300);
    }

    function renderQuizResult() {
      const chapter = notesData[currentChapterIdx];
      const totalQ = chapter.quiz.length;
      const percentage = Math.round((quizScore / totalQ) * 100);

      let stars = "⭐⭐⭐";
      if (percentage < 50) stars = "⭐";
      else if (percentage < 80) stars = "⭐⭐";

      if (percentage >= 80) sound.playVictory();

      let html = `
        <div class="card result-box" style="animation: fadeIn 0.4s ease;">
          <div class="result-stars">${stars}</div>
          <h2 style="font-family:'Fredoka',sans-serif; margin-bottom:8px; color:var(--text-dark);">Keputusan Kuiz Bab ${chapter.id}</h2>
          <div class="result-score">${quizScore} / ${totalQ}</div>
          <div class="result-percent">Skor Akhir: ${percentage}%</div>

          <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">
            ${percentage >= 80 ? 'Tahniah! Anda telah menguasai adab ini dengan sangat cemerlang!' : 'Bagus! Ulang kaji semula nota bab ini untuk dapatkan skor penuh!'}
          </p>

          <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="nav-btn btn-next" onclick="startQuizMode()" style="width:100%;">
              <i class="fa-solid fa-rotate-right"></i> Cuba Kuiz Semula
            </button>
            <button class="nav-btn btn-prev" onclick="loadChapter(currentChapterIdx)" style="width:100%;">
              <i class="fa-solid fa-book"></i> Kembali Ke Nota Bab
            </button>
          </div>
        </div>
      `;

      mainContent.innerHTML = html;
    }

    /* ==========================================================================
       MODAL MENU & NAVIGATION LISTENERS
       ========================================================================== */
    function renderChapterMenu() {
      let html = '';
      notesData.forEach((ch, idx) => {
        html += `
          <div class="chapter-select-item" id="menuItem-${idx}" onclick="selectChapterFromMenu(${idx})">
            <span>Bab ${ch.id}: ${ch.title}</span>
            <i class="fa-solid fa-chevron-right" style="font-size:12px; color:#94A3B8;"></i>
          </div>
        `;
      });
      chapterMenuList.innerHTML = html;
    }

    function updateActiveMenuItem() {
      document.querySelectorAll('.chapter-select-item').forEach((el, idx) => {
        if (idx === currentChapterIdx) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    window.selectChapterFromMenu = function(idx) {
      loadChapter(idx);
      closeMenuModal();
    }

    function openMenuModal() {
      menuModal.classList.add('active');
    }

    function closeMenuModal() {
      menuModal.classList.remove('active');
    }

    function setupEventListeners() {
      btnNext.addEventListener('click', () => {
        if (currentChapterIdx < notesData.length - 1) {
          loadChapter(currentChapterIdx + 1);
        }
      });

      btnPrev.addEventListener('click', () => {
        if (isQuizMode) {
          loadChapter(currentChapterIdx);
        } else if (currentChapterIdx > 0) {
          loadChapter(currentChapterIdx - 1);
        }
      });

      btnStartQuiz.addEventListener('click', () => {
        startQuizMode();
      });

      btnOpenMenu.addEventListener('click', openMenuModal);
      btnCloseMenu.addEventListener('click', closeMenuModal);
      menuModal.addEventListener('click', (e) => {
        if (e.target === menuModal) closeMenuModal();
      });

      btnSoundToggle.addEventListener('click', () => {
        sound.muted = !sound.muted;
        btnSoundToggle.innerHTML = sound.muted ? 
          '<i class="fa-solid fa-volume-xmark" style="color:var(--wrong);"></i>' : 
          '<i class="fa-solid fa-volume-high"></i>';
      });
    }

    // Run Application
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
